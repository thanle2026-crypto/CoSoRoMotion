[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosoromotion"
version = "0.1.0"
description = "Continuum Soft Robot Motion Planning via Optimal Transport, built on an independent Geometric Variable Strain (GVS) dynamics core."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "CoSoRoMotion Contributors" }]
keywords = ["soft robotics", "continuum robotics", "optimal transport", "motion planning", "geometric variable strain"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "continuumflow @ file:///../continuumflow",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
